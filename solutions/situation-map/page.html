<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Basel Situation Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
  <style>
    /*__SHARED_CSS__*/
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.45; overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #4e9ac0; outline-offset: 2px; }
    a { color: inherit; }

    .bar { height: var(--bar); display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--ink); background: var(--paper); position: relative; z-index: 3; }
    .wordmark { font: 700 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: var(--ink); text-decoration: none; }
    .bar h1 { font: 500 22px/1 var(--serif); letter-spacing: -.02em; margin: 0; white-space: nowrap; }
    :root[data-theme="dark"] .bar h1 { font: 700 13px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    .bar .spacer { flex: 1; }
    .tool { border: 1px solid var(--line); background: transparent; padding: 6px 10px; cursor: pointer; font: 12px/1 var(--mono); color: var(--muted); white-space: nowrap; }
    .tool:hover { color: var(--ink); border-color: var(--ink); }
    .tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .bar a { font: 12px/1 var(--mono); color: var(--muted); text-decoration: none; white-space: nowrap; }
    .bar a:hover { color: var(--ink); }
    kbd { font: 10px/1 var(--mono); border: 1px solid var(--line); padding: 1px 4px; margin-left: 6px; opacity: .8; }

    #map { position: absolute; top: var(--bar); left: 0; right: 0; bottom: 0; background: var(--map-bg); }

    .panel { position: absolute; top: calc(var(--bar) + 12px); left: 12px; width: 320px; max-height: calc(100% - var(--bar) - 64px); overflow: auto; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-float); z-index: 2; }
    .panel-section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .panel-section:last-child { border-bottom: 0; }
    .label { display: block; font: 700 10px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 8px; }
    .search input { width: 100%; border: 0; border-bottom: 2px solid var(--ink); background: transparent; padding: 6px 2px; font: 500 17px/1.2 var(--serif); }
    :root[data-theme="dark"] .search input { font: 14px/1.2 var(--mono); }
    .search-results { list-style: none; margin: 6px 0 0; padding: 0; }
    .search-results button { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 2px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
    .search-results button:hover { background: var(--accent-soft); }
    .search-results small { font: 11px/1.4 var(--mono); color: var(--muted); }

    .group-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px 4px; font: 700 10px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .12em; }
    .group-head small { font: 10px/1 var(--mono); color: var(--muted); letter-spacing: 0; text-transform: none; }
    .group-head[data-group="need"] { color: var(--red); }
    .group-head[data-group="possibility"] { color: var(--green); }
    .group-head[data-group="observations"] { color: var(--blue); }
    .group-head[data-group="planning"] { color: var(--violet); }
    .group-head[data-group="unknown"] { color: var(--amber); }
    .layer-row { padding: 6px 14px 8px; border-bottom: 1px solid var(--line); }
    .layer-row:last-child { border-bottom: 0; }
    .layer-row label { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; cursor: pointer; font-size: 14px; }
    .layer-row input { accent-color: var(--accent); width: 15px; height: 15px; margin: 2px 0 0; }
    .layer-row .meta { grid-column: 2 / 4; font: 11px/1.4 var(--mono); color: var(--muted); }
    .layer-row.disabled label { cursor: default; color: var(--muted); }
    .layer-row .extra { margin: 8px 0 0 26px; }
    .layer-row .extra img { max-width: 100%; background: #fff; padding: 4px; border: 1px solid var(--line); }
    .layer-row input[type="range"] { width: 100%; height: auto; accent-color: var(--accent); }
    .kind { font: 700 9px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; padding: 3px 5px; border: 1px solid currentColor; white-space: nowrap; }
    .kind.observed, .kind.verified { color: var(--green); }
    .kind.modelled, .kind.inference { color: var(--blue); }
    .kind.derived { color: var(--teal); }
    .kind.planning, .kind.proposal { color: var(--violet); }
    .kind.unknown { color: var(--amber); }
    .kind.conflict { color: var(--red); }
    .ramp { height: 10px; background: linear-gradient(90deg, #3b4cc0, #6fb0e8, #f5e98a, #f29b3c, #c0362c); border: 1px solid var(--line); }
    .ramp-labels { display: flex; justify-content: space-between; font: 11px/1.4 var(--mono); color: var(--muted); }
    .segmented { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--ink); margin-top: 4px; }
    .segmented button { border: 0; background: transparent; padding: 6px 4px; font-size: 13px; cursor: pointer; }
    .segmented button + button { border-left: 1px solid var(--ink); }
    .segmented button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .legend { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
    .legend li { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
    .legend .swatch { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
    .legend .count { font: 11px/1 var(--mono); color: var(--muted); }
    .small-controls { display: grid; gap: 6px; margin-top: 10px; font-size: 13px; }
    .small-controls label { display: flex; gap: 8px; align-items: center; }
    select { width: 100%; background: var(--surface); border: 1px solid var(--line); padding: 6px; }
    .panel-toggle { display: none; }

    .drawer { position: absolute; top: calc(var(--bar) + 12px); right: 12px; width: 390px; max-height: calc(100% - var(--bar) - 64px); overflow: auto; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-float); z-index: 2; display: none; }
    .drawer.open { display: block; }
    .drawer-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); position: relative; }
    .drawer-head .kicker { margin-right: 40px; font: 700 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin-bottom: 8px; }
    .drawer-head h2 { font: 500 28px/1.02 var(--serif); letter-spacing: -.02em; margin: 0 32px 6px 0; }
    :root[data-theme="dark"] .drawer-head h2 { font: 600 20px/1.2 var(--sans); letter-spacing: 0; }
    .drawer-head .latin { font-style: italic; color: var(--muted); }
    .drawer-head .id { font: 11px/1.4 var(--mono); color: var(--muted); margin-top: 8px; }
    .close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; }
    .block { padding: 14px 20px; border-bottom: 1px solid var(--line); }
    .block:last-child { border-bottom: 0; }
    .block h3 { font: 700 10px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .block h3[data-group="need"] { color: var(--red); }
    .block h3[data-group="possibility"] { color: var(--green); }
    .block h3[data-group="observations"] { color: var(--blue); }
    .block h3[data-group="planning"] { color: var(--violet); }
    .block h3[data-group="unknown"] { color: var(--amber); }
    dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
    dl.facts dt { color: var(--muted); }
    dl.facts dd { margin: 0; text-align: right; }
    .reading { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .reading:first-of-type { border-top: 0; padding-top: 0; }
    .reading .value { text-align: right; font-weight: 600; }
    .reading .why { grid-column: 1 / 3; font-size: 12px; color: var(--muted); }
    .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
    .button { border: 1px solid var(--ink); background: transparent; padding: 6px 10px; cursor: pointer; font-size: 13px; }
    a.button { text-decoration: none; color: inherit; display: inline-block; }
    .button:hover { background: var(--ink); color: var(--paper); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .layers { display: grid; gap: 3px; }
    .layer { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; height: 32px; padding: 0 10px; background: repeating-linear-gradient(135deg, rgba(185,106,22,.10) 0 6px, rgba(185,106,22,.22) 6px 7px); border-left: 4px solid var(--amber); }
    .layer b { font: 700 11px/1 var(--mono); }
    .layer span { font-size: 13px; }
    .reference { margin-top: 12px; font-size: 13px; }
    .reference summary { cursor: pointer; color: var(--muted); }
    .reference ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; opacity: .75; }
    .reference li { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .story h3 { font: 500 22px/1.05 var(--serif); text-transform: none; letter-spacing: -.01em; color: var(--ink); margin: 0 0 10px; }
    .story-item { border-top: 1px solid var(--line); padding: 10px 0; }
    .story-item:first-of-type { border-top: 0; padding-top: 0; }
    .story-item b { display: flex; justify-content: space-between; gap: 10px; align-items: start; font-size: 14px; margin-bottom: 4px; }
    .story-item p { margin: 0; font-size: 14px; }
    .sources { font-size: 12px; color: var(--muted); }
    .sources a { color: var(--muted); }
    pre.json { font: 11px/1.4 var(--mono); background: var(--surface-2); border: 1px solid var(--line); padding: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; }

    .hud { position: absolute; left: 12px; bottom: 34px; z-index: 2; display: flex; flex-wrap: wrap; gap: 0; font: 11px/1 var(--mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line); }
    .hud span { padding: 6px 9px; border-right: 1px solid var(--line); white-space: nowrap; }
    .hud span:last-child { border-right: 0; }
    .hud b { color: var(--ink); font-weight: 600; }
    :root[data-theme="dark"] .hud b { color: var(--accent); }

    .maplibregl-ctrl-attrib { font-size: 11px; }
    :root[data-theme="dark"] .maplibregl-ctrl-attrib, :root[data-theme="dark"] .maplibregl-ctrl-group { background: var(--surface); color: var(--muted); }
    :root[data-theme="dark"] .maplibregl-ctrl-attrib a { color: var(--muted); }
    :root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
    :root[data-theme="dark"] .maplibregl-ctrl-scale { background: var(--surface); color: var(--muted); border-color: var(--muted); }
    .maplibregl-popup-content { font: 13px/1.3 var(--sans); padding: 6px 9px; border-radius: 0; box-shadow: var(--shadow-float); background: var(--surface); color: var(--ink); }
    .maplibregl-popup-tip { display: none; }
    .map-error { position: absolute; right: 12px; bottom: 40px; max-width: 340px; background: var(--surface); border: 1px solid var(--red); padding: 12px; font-size: 13px; z-index: 2; display: none; }

    @media (max-width: 860px) {
      .bar { gap: 8px; }
      .bar h1, .wordmark, .bar .spacer, kbd, .hide-narrow { display: none; }
      .bar { justify-content: space-between; overflow-x: auto; }
      .panel { left: 8px; right: 8px; width: auto; top: calc(var(--bar) + 8px); max-height: 50%; }
      .panel:not(.expanded) > :not(:first-child) { display: none; }
      .panel-toggle { display: block; width: 100%; margin-top: 10px; }
      .drawer { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 64%; border-left: 0; border-right: 0; }
      .hud { display: none; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="index.html" title="All solutions">Sponge City</a>
    <h1>Basel situation map</h1>
    <span class="spacer"></span>
    <button class="tool" type="button" id="toggle-3d" aria-pressed="false" title="Tilt view and show buildings">3D<kbd>3</kbd></button>
    <button class="tool" type="button" id="toggle-theme" aria-pressed="false" title="Dark control-room theme">Control room<kbd>T</kbd></button>
    <button class="tool" type="button" id="lens-center" title="Inspect the place at the map centre">Place lens<kbd>L</kbd></button>
    <button class="tool hide-narrow" type="button" id="open-story">Why no water status?</button>
    <a href="evidence-atlas.html">Atlas →</a>
  </header>

  <div id="map" role="region" aria-label="Map of Basel"></div>
  <div class="map-error" id="map-error" role="alert"></div>

  <aside class="panel" id="panel" aria-label="Search and layers">
    <div class="panel-section">
      <label class="label" for="search">Find a street or tree number <kbd>/</kbd></label>
      <div class="search">
        <input id="search" type="search" autocomplete="off" placeholder="e.g. Elsässerstrasse, BS004993">
        <ul class="search-results" id="search-results"></ul>
      </div>
      <button class="button panel-toggle" type="button" id="panel-toggle" aria-expanded="false">Layers</button>
    </div>
    <div id="layer-list"></div>
    <div class="panel-section">
      <label class="label" for="basemap">Basemap · swisstopo</label>
      <select id="basemap">
        <option value="light">Base map (vector)</option>
        <option value="grey">National map (grey)</option>
        <option value="aerial">Aerial image (SWISSIMAGE)</option>
      </select>
    </div>
  </aside>

  <aside class="drawer" id="drawer" aria-live="polite"></aside>
  <div class="hud" id="hud" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
  <script id="map-logic">
    const SNAPSHOT = /*__MAP_DATA__*/ null;
    const ATLAS = /*__ATLAS_DATA__*/ null;

    // ---------- Colour (validated with the dataviz palette checker, light #f2f0e8 and dark #15191b surfaces)
    const PALETTE = {
      light: { age: ["#6da7ec", "#3987e5", "#256abf", "#184f95", "#0d366b"], categorical: ["#2a78d6", "#eb6834", "#1baf7a"], other: "#8f8d86", unknown: "#a9a69c", check: "#fab219", stroke: "#ffffff" },
      dark: { age: ["#256abf", "#3987e5", "#6da7ec", "#9ec5f4", "#cde2fb"], categorical: ["#3987e5", "#d95926", "#199e70"], other: "#7d817f", unknown: "#5c6163", check: "#fab219", stroke: "#0e1213" }
    };

    const AGE_CLASSES = [
      { id: "a0", label: "Under 10 years", test: age => age < 10 },
      { id: "a1", label: "10–29 years", test: age => age < 30 },
      { id: "a2", label: "30–59 years", test: age => age < 60 },
      { id: "a3", label: "60–99 years", test: age => age < 100 },
      { id: "a4", label: "100 years or more", test: age => age <= 400 },
      { id: "check", label: "Over 400 (check source)", test: () => true }
    ];
    const GROUP_CLASSES = [
      { id: "street", label: "Street trees", match: ["Strassenbäume", "Verkehrsgrün / Strassenbäume"] },
      { id: "public", label: "Parks and public green", match: ["Öffentliche Grünflächen", "Parkgrün", "Landschaftsgrün", "Naturschutzanlage", "Spiel- und Rastplätze", "Freizeit- und Sportanlagen"] },
      { id: "school", label: "Schools and kindergartens", match: ["Schul- und Kindergartenareal", "Schulen", "Kindergärten"] }
    ];

    function modeClasses(mode, theme = "light") {
      const p = PALETTE[theme];
      if (mode === "age") return [...AGE_CLASSES.map((item, i) => ({ id: item.id, label: item.label, color: item.id === "check" ? p.check : p.age[i] })), { id: "unknown", label: "Not recorded", color: p.unknown }];
      const named = mode === "group" ? GROUP_CLASSES : GENERA;
      return [...named.map((item, i) => ({ id: item.id, label: item.label, color: p.categorical[i] })), { id: "other", label: mode === "group" ? "Other (incl. private, city-maintained)" : "Other genera", color: p.other }];
    }

    function ageClass(age) {
      if (age === null || age === undefined) return "unknown";
      return AGE_CLASSES.find(item => item.test(age)).id;
    }
    function groupClass(group) {
      const hit = GROUP_CLASSES.find(item => item.match.includes(group));
      return hit ? hit.id : "other";
    }
    function genusOf(latin) {
      const word = (latin || "").trim().split(/\s+/)[0] || "";
      return /^[A-Z][a-z]+$/.test(word) ? word : "";
    }

    // ---------- Layer registry: every layer states what kind of evidence it is
    const KINDS = ["observed", "modelled", "derived", "planning", "unknown"];
    const GROUPS = [
      { id: "need", title: "Need", hint: "where intervention could matter" },
      { id: "possibility", title: "Possibility", hint: "what is there now" },
      { id: "observations", title: "Observations", hint: "measured, near-real-time" },
      { id: "planning", title: "Planning", hint: "decided perimeters" },
      { id: "unknown", title: "Unknown", hint: "no public data yet" }
    ];
    const BS_WMS = "https://wms.geo.bs.ch/?SERVICE=WMS&VERSION=1.3.0";
    const BS_CREDIT = "Quelle: Geodaten Kanton Basel-Stadt (CC BY 4.0)";
    const wmsTiles = layer => `${BS_WMS}&REQUEST=GetMap&LAYERS=${encodeURIComponent(layer)}&STYLES=&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/png&TRANSPARENT=true`;
    const wmsLegend = layer => `${BS_WMS}&REQUEST=GetLegendGraphic&FORMAT=image/png&SLD_VERSION=1.1.0&LAYER=${encodeURIComponent(layer)}`;
    const RUNOFF_ID = "ch.bafu.gefaehrdungskarte-oberflaechenabfluss";

    const LAYERS = [
      { id: "heat-night", group: "need", radio: "heat", kind: "modelled", title: "Night air temperature, 04:00", meta: "Klimaanalyse Basel-Stadt 2019 · relative scale", type: "raster", tiles: wmsTiles("KL_Lufttemperatur"), legend: { type: "ramp", low: "cooler", high: "warmer" }, credit: BS_CREDIT, opacity: 0.65, lens: "visual" },
      { id: "heat-day", group: "need", radio: "heat", kind: "modelled", title: "Daytime heat stress (PET), 14:00", meta: "Klimaanalyse Basel-Stadt 2019 · relative scale", type: "raster", tiles: wmsTiles("KL_HumanbioklimaSituation"), legend: { type: "ramp", low: "less stress", high: "more stress" }, credit: BS_CREDIT, opacity: 0.65, lens: "visual" },
      { id: "heat-night-2030", group: "need", radio: "heat", kind: "modelled", title: "Night air temperature, 2030 scenario", meta: "Klimaanalyse Basel-Stadt · scenario 2030", type: "raster", tiles: wmsTiles("KL_Lufttemperatur_2030"), legend: { type: "ramp", low: "cooler", high: "warmer" }, credit: BS_CREDIT, opacity: 0.65, lens: "visual" },
      { id: "heat-day-2030", group: "need", radio: "heat", kind: "modelled", title: "Daytime heat stress (PET), 2030 scenario", meta: "Klimaanalyse Basel-Stadt · scenario 2030", type: "raster", tiles: wmsTiles("KL_HumanbioklimaSituation_2030"), legend: { type: "ramp", low: "less stress", high: "more stress" }, credit: BS_CREDIT, opacity: 0.65, lens: "visual" },
      { id: "heat-focus", group: "need", kind: "planning", title: "Heat focus areas (Stadtklimakonzept)", meta: "Areas most affected by urban heat islands · based on 2019 analysis", type: "raster", tiles: wmsTiles("ch.bs.fokusgebiet_hitzeentwicklung_fgsk"), legend: { type: "image", url: wmsLegend("ch.bs.fokusgebiet_hitzeentwicklung_fgsk") }, credit: BS_CREDIT, opacity: 0.55, lens: "featureinfo", wmsLayer: "ch.bs.fokusgebiet_hitzeentwicklung_fgsk" },
      { id: "runoff", group: "need", kind: "modelled", title: "Surface runoff hazard (rare events)", meta: "BAFU 2018 · screening only, not finer than 1:12,500", type: "raster", tiles: `https://wmts.geo.admin.ch/1.0.0/${RUNOFF_ID}/default/current/3857/{z}/{x}/{y}.png`, maxzoom: 15.5, legend: { type: "image", url: `https://api3.geo.admin.ch/static/images/legends/${RUNOFF_ID}_de.png` }, credit: "© BAFU / geo.admin.ch", opacity: 0.75, lens: "tile-colour" },
      { id: "trees", group: "possibility", kind: "observed", title: "Trees (Baumkataster)", meta: "Stadtgärtnerei Basel, Gemeinde Riehen · snapshot", type: "trees", lens: "snapshot", defaultOn: true },
      { id: "buildings", group: "possibility", kind: "derived", title: "Buildings, 3D", meta: "swisstopo base map · generalised heights", type: "buildings", lens: "none" },
      { id: "stations", group: "observations", kind: "observed", title: "Climate stations (meteoblue)", meta: "Air temperature and rain · live refresh", type: "stations", lens: "snapshot", defaultOn: true },
      { id: "voltanord", group: "planning", kind: "planning", title: "VoltaNord development plans", meta: "BP 226A/226B in force since 16.06.2026", type: "perimeter", lens: "snapshot", defaultOn: true },
      { id: "soil-water", group: "unknown", kind: "unknown", title: "Soil water", meta: "No public sensors in Basel", type: "none" },
      { id: "infiltration", group: "unknown", kind: "unknown", title: "Infiltration capacity", meta: "Measured only inside ZHAW monitoring (not public)", type: "none" },
      { id: "utilities", group: "unknown", kind: "unknown", title: "Underground utilities", meta: "Not public", type: "none" },
      { id: "ownership", group: "unknown", kind: "unknown", title: "Ownership", meta: "Not loaded in this prototype", type: "none" }
    ];

    // Official BAFU legend colours (read from the published legend image).
    const RUNOFF_CLASSES = [
      { id: "low", label: "Flow depth 0–0.1 m", rgb: [255, 189, 255] },
      { id: "medium", label: "Flow depth 0.1–0.25 m", rgb: [223, 115, 255] },
      { id: "high", label: "Flow depth over 0.25 m", rgb: [132, 0, 168] },
      { id: "water", label: "Water body", rgb: [0, 166, 255] },
      { id: "glacier", label: "Glacier", rgb: [222, 245, 255] }
    ];

    function matchRunoffColour(rgba, tolerance = 40) {
      if (!rgba || rgba[3] < 128) return { id: "none", label: "Not marked as affected" };
      let best = null;
      for (const item of RUNOFF_CLASSES) {
        const d = Math.hypot(rgba[0] - item.rgb[0], rgba[1] - item.rgb[1], rgba[2] - item.rgb[2]);
        if (!best || d < best.d) best = { item, d };
      }
      return best.d <= tolerance ? { id: best.item.id, label: best.item.label } : { id: "unclear", label: "Unclear (class edge)" };
    }

    function tilePixel(lon, lat, z) {
      const n = 2 ** z;
      const x = (lon + 180) / 360 * n;
      const rad = lat * Math.PI / 180;
      const y = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
      return { z, x: Math.floor(x), y: Math.floor(y), px: Math.floor((x % 1) * 256), py: Math.floor((y % 1) * 256) };
    }

    function mercatorBox(lon, lat, halfMetres = 1) {
      const x = lon * 20037508.34 / 180;
      const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) * 6378137;
      return [x - halfMetres, y - halfMetres, x + halfMetres, y + halfMetres];
    }

    function pointInRing(lon, lat, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i];
        const [xj, yj] = ring[j];
        if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    function pointInGeometry(lon, lat, geometry) {
      const polygons = geometry.type === "Polygon" ? [geometry.coordinates] : geometry.type === "MultiPolygon" ? geometry.coordinates : [];
      return polygons.some(rings => pointInRing(lon, lat, rings[0]) && !rings.slice(1).some(hole => pointInRing(lon, lat, hole)));
    }
    function perimetersAt(lon, lat, collection) {
      return collection.features.filter(feature => pointInGeometry(lon, lat, feature.geometry)).map(feature => feature.properties);
    }

    // ---------- Snapshot decoding and queries
    function decodeTrees(snapshot) {
      const { columns, dictionaries, rows } = snapshot.trees;
      const at = Object.fromEntries(columns.map((name, i) => [name, i]));
      return rows.map(row => {
        const [latin, german] = dictionaries.species[row[at.species]].split("|");
        const group = dictionaries.group[row[at.group]];
        return {
          id: row[at.id], lon: row[at.lon], lat: row[at.lat], latin, german, genus: genusOf(latin),
          age: row[at.age_years], yearsAtSite: row[at.years_at_site], street: dictionaries.street[row[at.street]],
          group, groupClass: groupClass(group), municipality: dictionaries.municipality[row[at.municipality]], protection: dictionaries.protection[row[at.protection]]
        };
      });
    }
    function topGenera(trees, n) {
      const counts = new Map();
      for (const tree of trees) if (tree.genus) counts.set(tree.genus, (counts.get(tree.genus) || 0) + 1);
      return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, n).map(([genus]) => ({ id: genus, label: genus }));
    }
    function classify(tree, mode) {
      if (mode === "age") return ageClass(tree.age);
      if (mode === "group") return tree.groupClass;
      return GENERA.some(item => item.id === tree.genus) ? tree.genus : "other";
    }
    function isVisible(tree, filters) {
      if (filters.streetOnly && tree.groupClass !== "street") return false;
      if (filters.municipality && tree.municipality !== filters.municipality) return false;
      return true;
    }
    function legendCounts(trees, mode, filters) {
      const counts = Object.fromEntries(modeClasses(mode).map(item => [item.id, 0]));
      let total = 0;
      for (const tree of trees) {
        if (!isVisible(tree, filters)) continue;
        counts[classify(tree, mode)] += 1;
        total += 1;
      }
      return { counts, total };
    }
    function distanceMetres(lon1, lat1, lon2, lat2) {
      const rad = Math.PI / 180;
      const a = Math.sin((lat2 - lat1) * rad / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin((lon2 - lon1) * rad / 2) ** 2;
      return 2 * 6371000 * Math.asin(Math.sqrt(a));
    }
    function nearestStation(lon, lat, stations) {
      let best = null;
      for (const station of stations) {
        const distance = distanceMetres(lon, lat, station.lon, station.lat);
        if (!best || distance < best.distance) best = { station, distance };
      }
      return best;
    }
    function treesNear(lon, lat, trees, radius) {
      const dLat = radius / 111320;
      const dLon = radius / (111320 * Math.cos(lat * Math.PI / 180));
      return trees.filter(tree => Math.abs(tree.lat - lat) <= dLat && Math.abs(tree.lon - lon) <= dLon && distanceMetres(lon, lat, tree.lon, tree.lat) <= radius);
    }
    function normalise(text) {
      return (text || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss");
    }
    function search(trees, query, limit = 8) {
      const q = normalise(query).trim();
      if (q.length < 2) return [];
      const exact = trees.find(tree => normalise(tree.id) === q);
      if (exact) return [{ type: "tree", label: exact.id, detail: `${exact.german || exact.latin} · ${exact.street}`, trees: [exact] }];
      const streets = new Map();
      for (const tree of trees) {
        const name = normalise(tree.street);
        if (!name.includes(q)) continue;
        if (!streets.has(tree.street)) streets.set(tree.street, { starts: name.startsWith(q), trees: [] });
        streets.get(tree.street).trees.push(tree);
      }
      return [...streets.entries()].sort((a, b) => (b[1].starts - a[1].starts) || b[1].trees.length - a[1].trees.length).slice(0, limit)
        .map(([street, hit]) => ({ type: "street", label: street, detail: `${hit.trees.length} trees`, trees: hit.trees }));
    }
    function bounds(trees) {
      const lons = trees.map(tree => tree.lon);
      const lats = trees.map(tree => tree.lat);
      return [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];
    }
    function treeFeatures(trees) {
      return { type: "FeatureCollection", features: trees.map((tree, i) => ({ type: "Feature", id: i, geometry: { type: "Point", coordinates: [tree.lon, tree.lat] }, properties: { i, age: ageClass(tree.age), group: tree.groupClass, genus: tree.genus, muni: tree.municipality } })) };
    }
    function recordById(id) { return ATLAS && ATLAS.records.find(record => record.id === id); }

    // ---------- Place Profile (schema place-profile/draft-0, see docs/DECISION-CANVAS.md)
    // Every slot keeps a status; nothing unknown becomes zero.
    function buildPlaceProfile(input) {
      const slot = (status, value, evidence, note) => ({ status, value: value ?? null, evidence_ids: evidence, ...(note ? { note } : {}) });
      const near = input.treesNearby;
      return {
        schema_version: "place-profile/draft-0",
        place_id: `point-${input.lon.toFixed(5)}-${input.lat.toFixed(5)}`,
        geometry_ref: { type: "Point", coordinates: [Number(input.lon.toFixed(6)), Number(input.lat.toFixed(6))] },
        generated_at: input.generatedAt,
        need: {
          heat_focus_area: input.heatFocus ? slot("planning", input.heatFocus.label, ["geo-bs-fokusgebiete"], "Policy classification from the 2019 climate analysis") : slot("unknown", null, ["geo-bs-fokusgebiete"], input.heatFocusError || "Not queried"),
          night_heat: slot("modelled", null, ["geo-bs-klimaanalyse"], "Map layer only; the service exposes no values"),
          day_heat: slot("modelled", null, ["geo-bs-klimaanalyse"], "Map layer only; the service exposes no values"),
          surface_runoff: input.runoff ? slot("derived", input.runoff.label, ["bafu-oberflaechenabfluss"], "Read from the official tile colour at 1:24,000; screening only") : slot("unknown", null, ["bafu-oberflaechenabfluss"], input.runoffError || "Not queried")
        },
        possibility: {
          existing_tree_count: slot("observed", near.length, ["data-bs-100052"], `Register trees within ${input.radius} m`),
          street_tree_count: slot("observed", near.filter(tree => tree.groupClass === "street").length, ["data-bs-100052"]),
          canopy_fraction: slot("unknown", null, ["data-bs-100357"], "Canopy raster not loaded in this prototype"),
          sealed_fraction: slot("unknown", null, ["data-bs-100477"], "Land-cover data not loaded in this prototype"),
          infiltration: slot("unknown", null, ["fact-no-public-monitoring-data"]),
          soil_water: slot("unknown", null, ["fact-no-public-monitoring-data"]),
          utilities: slot("unknown", null, []),
          ownership: slot("unknown", null, [])
        },
        context: {
          nearest_station: input.station ? slot("observed", { name: input.station.station.name, distance_m: Math.round(input.station.distance), air_temp_c: input.station.station.air_temp_c, rain_48h_mm: input.station.station.rain_48h_mm, observed_at: input.station.station.observed_at }, ["data-bs-100009"]) : slot("unknown", null, ["data-bs-100009"]),
          planning_perimeter: slot("observed", input.perimeters.map(p => p.plan), ["data-bs-100234"], input.perimeters.length ? "Inside a VoltaNord development plan" : "Outside the VoltaNord development plans")
        },
        candidate_interventions: []
      };
    }

    // ---------- URL state
    function encodeState(s) {
      const parts = [`v=${[s.lon, s.lat].map(n => n.toFixed(5)).join(",")},${s.zoom.toFixed(2)},${Math.round(s.pitch)},${Math.round(s.bearing)}`, `l=${s.layers.join(".")}`];
      if (s.mode && s.mode !== "age") parts.push(`c=${s.mode}`);
      if (s.theme === "dark") parts.push("t=dark");
      if (s.basemap && s.basemap !== "light") parts.push(`b=${s.basemap}`);
      if (s.tree) parts.push(`tree=${encodeURIComponent(s.tree)}`);
      if (s.lens) parts.push(`lens=${s.lens.map(n => n.toFixed(5)).join(",")}`);
      return "#" + parts.join("&");
    }
    function decodeState(hash) {
      const out = {};
      for (const part of (hash || "").replace(/^#/, "").split("&")) {
        const [key, raw] = part.split("=");
        if (!raw) continue;
        const value = decodeURIComponent(raw);
        if (key === "v") {
          const [lon, lat, zoom, pitch, bearing] = value.split(",").map(Number);
          if ([lon, lat, zoom].every(Number.isFinite)) Object.assign(out, { lon, lat, zoom, pitch: pitch || 0, bearing: bearing || 0 });
        }
        if (key === "l") out.layers = value.split(".").filter(id => LAYERS.some(layer => layer.id === id));
        if (key === "c" && ["age", "group", "genus"].includes(value)) out.mode = value;
        if (key === "t" && value === "dark") out.theme = "dark";
        if (key === "b" && ["light", "grey", "aerial"].includes(value)) out.basemap = value;
        if (key === "tree") out.tree = value;
        if (key === "lens") { const [lon, lat] = value.split(",").map(Number); if (Number.isFinite(lon) && Number.isFinite(lat)) out.lens = [lon, lat]; }
      }
      return out;
    }

    // ---------- Dark basemap: recolour literal colours in the swisstopo style
    function parseColour(text) {
      if (typeof text !== "string") return null;
      let m = text.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (m) {
        const hex = m[1].length === 3 ? m[1].split("").map(c => c + c).join("") : m[1];
        return { rgb: [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16) / 255), a: 1 };
      }
      m = text.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/i);
      if (m) return { rgb: [m[1], m[2], m[3]].map(v => Number(v) / 255), a: m[4] === undefined ? 1 : Number(m[4]) };
      m = text.match(/^hsla?\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*(?:,\s*([\d.]+)\s*)?\)$/i);
      if (m) return { hsl: [Number(m[1]), Number(m[2]) / 100, Number(m[3]) / 100], a: m[4] === undefined ? 1 : Number(m[4]) };
      return null;
    }
    function rgbToHsl([r, g, b]) {
      const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
      if (max === min) return [0, 0, l];
      const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return [h * 60, s, l];
    }
    function darkColour(text) {
      const c = parseColour(text);
      if (!c) return text;
      const [h, s, l] = c.hsl || rgbToHsl(c.rgb);
      const nl = 0.07 + (1 - l) * 0.36;
      return `hsla(${h.toFixed(0)}, ${(s * 55).toFixed(0)}%, ${(nl * 100).toFixed(1)}%, ${c.a})`;
    }
    function darkenValue(value) {
      if (typeof value === "string") return darkColour(value);
      if (Array.isArray(value)) return value.map(darkenValue);
      if (value && typeof value === "object") return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, darkenValue(v)]));
      return value;
    }
    function darkStyle(style) {
      const copy = JSON.parse(JSON.stringify(style));
      for (const layer of copy.layers) {
        for (const key of Object.keys(layer.paint || {})) if (key.includes("color")) layer.paint[key] = darkenValue(layer.paint[key]);
      }
      return copy;
    }

    // ---------- Formatting
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function formatYears(value) { return value === null || value === undefined ? "Not recorded" : `${value} years`; }
    function formatTime(iso) {
      if (!iso) return "–";
      return new Date(iso).toLocaleString("de-CH", { timeZone: "Europe/Zurich", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function formatNumber(value, unit, digits = 1) { return value === null || value === undefined ? "–" : `${Number(value).toFixed(digits)} ${unit}`; }

    const TREES = decodeTrees(SNAPSHOT);
    const GENERA = topGenera(TREES, PALETTE.light.categorical.length);
    const MUNICIPALITIES = SNAPSHOT.trees.dictionaries.municipality.filter(Boolean);
    const SOIL_WATER = {
      status: "unknown",
      depths: ["30 cm", "60 cm", "90 cm"],
      reference: [{ label: "Good", range: "0–33" }, { label: "Moderate", range: "33–81" }, { label: "Critical", range: "81–270" }],
      record_ids: ["fact-no-public-monitoring-data", "precedent-qtrees-status-classes", "boundary-qtrees-transfer"]
    };
    const STORIES = [
      { title: "Why the map shows no water status", record_ids: ["fact-no-public-monitoring-data", "precedent-qtrees-sensor-schema", "precedent-qtrees-status-classes", "boundary-qtrees-transfer"] },
      { title: "What VoltaNord will measure", record_ids: ["fact-monitoring-scope", "fact-voltanord-plan-perimeter", "fact-vegetation-project-2024", "interpret-voltanord-likely-instruments", "question-protocol"] }
    ];
  </script>
  <script>
    const $ = selector => document.querySelector(selector);
    const initial = decodeState(location.hash);
    const state = {
      mode: initial.mode || "age",
      theme: initial.theme || "light",
      basemap: initial.basemap || "light",
      threeD: (initial.pitch || 0) > 5,
      filters: { streetOnly: false, municipality: "" },
      on: new Set(initial.layers || LAYERS.filter(layer => layer.defaultOn).map(layer => layer.id)),
      opacity: Object.fromEntries(LAYERS.filter(layer => layer.opacity).map(layer => [layer.id, layer.opacity])),
      selectedTree: null,
      lens: null,
      cursor: null
    };
    const SWISSTOPO_STYLE = "https://vectortiles.geo.admin.ch/styles/ch.swisstopo.lightbasemap.vt/style.json";
    const SWISSTOPO_CREDIT = "© <a href=\"https://www.swisstopo.admin.ch/\">swisstopo</a>";
    const DATA_CREDIT = "Trees, stations, plans: Stadtgärtnerei Basel, Gemeinde Riehen, meteoblue AG, Kanton Basel-Stadt via <a href=\"https://data.bs.ch\">data.bs.ch</a> (CC BY 4.0)";
    let lightStyleJson = null;

    const rasterStyle = (layer) => ({
      version: 8,
      sources: { base: { type: "raster", tiles: [`https://wmts.geo.admin.ch/1.0.0/${layer}/default/current/3857/{z}/{x}/{y}.jpeg`], tileSize: 256, maxzoom: 19, attribution: SWISSTOPO_CREDIT } },
      layers: [{ id: "base", type: "raster", source: "base" }]
    });

    async function basemapStyle() {
      if (state.basemap === "grey") return rasterStyle("ch.swisstopo.pixelkarte-grau");
      if (state.basemap === "aerial") return rasterStyle("ch.swisstopo.swissimage");
      if (state.theme !== "dark") return SWISSTOPO_STYLE;
      if (!lightStyleJson) lightStyleJson = await (await fetch(SWISSTOPO_STYLE)).json();
      return darkStyle(lightStyleJson);
    }

    function colourExpression() {
      const property = { age: "age", group: "group", genus: "genus" }[state.mode];
      const classes = modeClasses(state.mode, state.theme);
      const expression = ["match", ["get", property]];
      for (const item of classes) if (item.id !== "other" && item.id !== "unknown") expression.push(item.id, item.color);
      expression.push(classes[classes.length - 1].color);
      return expression;
    }
    function treeFilter() {
      const filter = ["all"];
      if (state.filters.streetOnly) filter.push(["==", ["get", "group"], "street"]);
      if (state.filters.municipality) filter.push(["==", ["get", "muni"], state.filters.municipality]);
      return filter;
    }

    // ---------- Layer panel
    function kindBadge(kind) { return `<span class="kind ${kind}">${kind}</span>`; }

    function treeControls() {
      const { counts, total } = legendCounts(TREES, state.mode, state.filters);
      return `
        <div class="segmented" role="group" aria-label="Colour trees by">
          ${[["age", "Age"], ["group", "Setting"], ["genus", "Genus"]].map(([id, label]) => `<button type="button" data-mode="${id}" aria-pressed="${state.mode === id}">${label}</button>`).join("")}
        </div>
        <ul class="legend">${modeClasses(state.mode, state.theme).map(item => `<li><span class="swatch" style="background:${item.color}"></span><span>${escapeHtml(item.label)}</span><span class="count">${counts[item.id].toLocaleString("de-CH")}</span></li>`).join("")}</ul>
        <div class="small-controls">
          <label><input type="checkbox" id="street-only" ${state.filters.streetOnly ? "checked" : ""}> Street trees only</label>
          <select id="municipality" aria-label="Municipality"><option value="">Basel and Riehen</option>${MUNICIPALITIES.map(name => `<option ${state.filters.municipality === name ? "selected" : ""}>${escapeHtml(name)}</option>`).join("")}</select>
          <span class="count" style="font:11px/1.4 var(--mono);color:var(--muted)">${total.toLocaleString("de-CH")} of ${TREES.length.toLocaleString("de-CH")} trees shown</span>
        </div>`;
    }

    function layerExtra(layer) {
      if (!state.on.has(layer.id)) return "";
      if (layer.type === "trees") return `<div class="extra">${treeControls()}</div>`;
      const parts = [];
      if (layer.legend?.type === "ramp") parts.push(`<div class="ramp" aria-hidden="true"></div><div class="ramp-labels"><span>${layer.legend.low}</span><span>${layer.legend.high}</span></div><p class="note" style="margin-top:4px">Colours are relative. The service publishes no class values.</p>`);
      if (layer.legend?.type === "image") parts.push(`<img src="${layer.legend.url}" alt="Official legend for ${escapeHtml(layer.title)}" loading="lazy">`);
      if (layer.opacity) parts.push(`<label class="label" style="margin:8px 0 2px">Opacity</label><input type="range" min="0.1" max="1" step="0.05" value="${state.opacity[layer.id]}" data-opacity="${layer.id}" aria-label="Opacity of ${escapeHtml(layer.title)}">`);
      if (layer.maxzoom) parts.push(`<p class="note" style="margin-top:4px">Hidden beyond zoom ${layer.maxzoom}, as the publisher requires.</p>`);
      if (layer.type === "buildings" && !state.threeD) parts.push(`<p class="note" style="margin-top:0">Visible in 3D view (press 3).</p>`);
      return parts.length ? `<div class="extra">${parts.join("")}</div>` : "";
    }

    function renderLayerPanel() {
      $("#layer-list").innerHTML = GROUPS.map(group => {
        const items = LAYERS.filter(layer => layer.group === group.id);
        return `<div class="panel-section" style="padding:0">
          <div class="group-head" data-group="${group.id}"><span>${group.title}</span><small>${group.hint}</small></div>
          ${items.map(layer => {
            const disabled = layer.type === "none";
            const type = layer.radio ? "radio" : "checkbox";
            return `<div class="layer-row ${disabled ? "disabled" : ""}">
              <label>${disabled ? "<span></span>" : `<input type="${type}" ${layer.radio ? `name="${layer.radio}"` : ""} data-layer="${layer.id}" ${state.on.has(layer.id) ? "checked" : ""}>`}
                <span>${escapeHtml(layer.title)}</span>${kindBadge(layer.kind)}
                <span class="meta">${escapeHtml(layer.meta)}</span>
              </label>${layerExtra(layer)}
            </div>`;
          }).join("")}
          ${group.id === "need" ? `<div class="layer-row"><label><input type="radio" name="heat" data-layer="" ${LAYERS.some(l => l.radio === "heat" && state.on.has(l.id)) ? "" : "checked"}><span>No heat model</span><span></span></label></div>` : ""}
        </div>`;
      }).join("");

      document.querySelectorAll("[data-layer]").forEach(input => input.addEventListener("change", () => {
        const id = input.dataset.layer;
        if (input.type === "radio") {
          LAYERS.filter(layer => layer.radio === input.name).forEach(layer => state.on.delete(layer.id));
          if (id) state.on.add(id);
        } else if (input.checked) state.on.add(id); else state.on.delete(id);
        applyLayers();
        renderLayerPanel();
        syncUrl();
      }));
      document.querySelectorAll("[data-opacity]").forEach(input => input.addEventListener("input", () => {
        state.opacity[input.dataset.opacity] = Number(input.value);
        applyLayers();
      }));
      document.querySelectorAll(".segmented button").forEach(button => button.addEventListener("click", () => { state.mode = button.dataset.mode; applyLayers(); renderLayerPanel(); syncUrl(); }));
      $("#street-only")?.addEventListener("change", event => { state.filters.streetOnly = event.target.checked; applyLayers(); renderLayerPanel(); });
      $("#municipality")?.addEventListener("change", event => { state.filters.municipality = event.target.value; applyLayers(); renderLayerPanel(); });
    }

    // ---------- Map layers
    function addDataLayers() {
      const dark = state.theme === "dark";
      if (state.basemap !== "light") map.setPaintProperty("base", "raster-brightness-max", dark ? 0.55 : 1);
      if (state.basemap !== "light") map.setPaintProperty("base", "raster-saturation", dark ? -0.6 : 0);

      for (const layer of LAYERS.filter(item => item.type === "raster")) {
        map.addSource(layer.id, { type: "raster", tiles: [layer.tiles], tileSize: 256, attribution: layer.credit });
        map.addLayer({ id: layer.id, type: "raster", source: layer.id, ...(layer.maxzoom ? { maxzoom: layer.maxzoom } : {}), paint: { "raster-opacity": state.opacity[layer.id], "raster-fade-duration": 150 } });
      }
      map.addSource("bld", { type: "vector", url: "https://vectortiles.geo.admin.ch/tiles/ch.swisstopo.base.vt/v1.0.0/tiles.json" });
      map.addLayer({
        id: "buildings", type: "fill-extrusion", source: "bld", "source-layer": "building", minzoom: 14,
        paint: {
          "fill-extrusion-color": dark ? "#2a3437" : "#d9d6cc",
          "fill-extrusion-height": ["coalesce", ["get", "render_height"], 5],
          "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
          "fill-extrusion-opacity": dark ? 0.85 : 0.8
        }
      });
      map.addSource("trees", { type: "geojson", data: treeFeatures(TREES) });
      map.addSource("stations", { type: "geojson", data: { type: "FeatureCollection", features: SNAPSHOT.stations.map((station, i) => ({ type: "Feature", id: i, geometry: { type: "Point", coordinates: [station.lon, station.lat] }, properties: { i } })) } });
      map.addSource("perimeter", { type: "geojson", data: SNAPSHOT.perimeters });
      map.addSource("selected", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addSource("lens", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

      const violet = dark ? "#b9a5f0" : "#66508f";
      map.addLayer({ id: "perimeter-fill", type: "fill", source: "perimeter", paint: { "fill-color": violet, "fill-opacity": 0.08 } });
      map.addLayer({ id: "perimeter-line", type: "line", source: "perimeter", paint: { "line-color": violet, "line-width": 2, "line-dasharray": [3, 2] } });
      map.addLayer({
        id: "trees", type: "circle", source: "trees",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 1.6, 14, 3, 17, 7, 19, 11],
          "circle-stroke-color": PALETTE[state.theme].stroke,
          "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 12, 0, 15, 1],
          "circle-pitch-alignment": "map"
        }
      });
      const ink = dark ? "#e4ece6" : "#13271f";
      map.addLayer({ id: "lens-ring", type: "circle", source: "lens", paint: { "circle-radius": ["interpolate", ["exponential", 2], ["zoom"], 12, 25 * 4096 / 105602, 20, 25 * 1048576 / 105602], "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": dark ? "#5fd0a0" : "#0d6b4c", "circle-stroke-width": 2, "circle-pitch-alignment": "map" } });
      map.addLayer({ id: "lens-dot", type: "circle", source: "lens", paint: { "circle-radius": 4, "circle-color": dark ? "#5fd0a0" : "#0d6b4c" } });
      map.addLayer({ id: "selected", type: "circle", source: "selected", paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 11, 7, 17, 13], "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": ink, "circle-stroke-width": 3 } });
      map.addLayer({ id: "stations", type: "circle", source: "stations", paint: { "circle-radius": 6, "circle-color": dark ? "#15191b" : "#ffffff", "circle-stroke-color": ink, "circle-stroke-width": 2.5 } });
      map.addLayer({ id: "stations-dot", type: "circle", source: "stations", paint: { "circle-radius": 2, "circle-color": ink } });
      applyLayers();
      setSelectedTree(state.selectedTree);
      setLensMarker(state.lens);
    }

    function applyLayers() {
      if (!window.map || !map.getLayer("trees")) return;
      const vis = (id, on) => map.getLayer(id) && map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
      for (const layer of LAYERS.filter(item => item.type === "raster")) {
        vis(layer.id, state.on.has(layer.id));
        map.setPaintProperty(layer.id, "raster-opacity", state.opacity[layer.id]);
      }
      vis("buildings", state.on.has("buildings") && state.threeD);
      vis("trees", state.on.has("trees"));
      vis("stations", state.on.has("stations"));
      vis("stations-dot", state.on.has("stations"));
      vis("perimeter-fill", state.on.has("voltanord"));
      vis("perimeter-line", state.on.has("voltanord"));
      map.setPaintProperty("trees", "circle-color", colourExpression());
      map.setFilter("trees", treeFilter());
      renderHud();
    }

    function setSelectedTree(tree) {
      state.selectedTree = tree;
      if (window.map?.getSource("selected")) map.getSource("selected").setData(tree ? { type: "Feature", geometry: { type: "Point", coordinates: [tree.lon, tree.lat] }, properties: {} } : { type: "FeatureCollection", features: [] });
    }
    function setLensMarker(point) {
      state.lens = point;
      if (window.map?.getSource("lens")) map.getSource("lens").setData(point ? { type: "Feature", geometry: { type: "Point", coordinates: point }, properties: {} } : { type: "FeatureCollection", features: [] });
    }

    // ---------- HUD and URL
    function renderHud() {
      if (!window.map) return;
      const c = state.cursor || map.getCenter();
      const active = LAYERS.filter(layer => state.on.has(layer.id)).length;
      $("#hud").innerHTML = `
        <span><b>${c.lat.toFixed(4)}</b> N <b>${c.lng.toFixed(4)}</b> E</span>
        <span>Z <b>${map.getZoom().toFixed(1)}</b></span>
        <span>Pitch <b>${Math.round(map.getPitch())}°</b></span>
        <span>Layers <b>${active}</b></span>
        <span>Stations <b>${SNAPSHOT.stations.length}</b></span>
        <span>Snapshot <b>${formatTime(SNAPSHOT.fetched_at)}</b></span>`;
    }
    let urlTimer = null;
    function syncUrl() {
      if (!window.map) return;
      clearTimeout(urlTimer);
      urlTimer = setTimeout(() => {
        const c = map.getCenter();
        history.replaceState(null, "", encodeState({ lon: c.lng, lat: c.lat, zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing(), layers: [...state.on], mode: state.mode, theme: state.theme, basemap: state.basemap, tree: state.selectedTree?.id, lens: state.lens }));
      }, 250);
    }

    // ---------- Drawer content
    function sourceLinks(ids) {
      return SNAPSHOT.sources.filter(source => ids.includes(source.dataset)).map(source => `<a href="${source.url}" target="_blank" rel="noopener">${escapeHtml(source.title)}</a> (${escapeHtml(source.publisher)}, ${escapeHtml(source.licence)})`).join("; ");
    }
    function recordBadge(id) {
      const record = recordById(id);
      return record ? kindBadge(record.status) : "";
    }
    function soilWaterBlock() {
      return `
        <div class="block">
          <h3 data-group="unknown">Soil water in the tree pit <span class="kind unknown">unknown</span></h3>
          <div class="layers" aria-label="Soil water by depth: unknown at all depths">
            ${SOIL_WATER.depths.map(depth => `<div class="layer"><b>${depth}</b><span>No public measurement</span><span class="kind unknown">unknown</span></div>`).join("")}
          </div>
          <p class="note">Basel publishes no soil-water sensor data, so this map shows no water status. Berlin's QTrees measured suction tension at these three depths.</p>
          <details class="reference">
            <summary>Berlin reference classes (not applied here)</summary>
            <ul>${SOIL_WATER.reference.map(item => `<li><span>${item.label}</span><span>${item.range}</span></li>`).join("")}</ul>
            <p class="note">Suction tension, unit likely kPa (inferred). Not calibrated for Basel soils or sponge-city substrates. ${recordBadge("precedent-qtrees-status-classes")}</p>
          </details>

    }
    function stationBlock(hit, title = "Nearest climate station") {
      const station = hit.station;
      return `
        <div class="block" id="station-block">
          <h3 data-group="observations">${title} <span class="kind observed">observed</span></h3>
          <dl class="facts">
            <dt>Station</dt><dd>${escapeHtml(station.name)}${hit.distance !== null ? ` · ${Math.round(hit.distance)} m` : ""}</dd>
            <dt>Air temperature</dt><dd data-field="air_temp_c">${formatNumber(station.air_temp_c, "°C")}</dd>
            <dt>Rain, last 24 h</dt><dd data-field="rain_24h_mm">${formatNumber(station.rain_24h_mm, "mm")}</dd>
            <dt>Rain, last 48 h</dt><dd data-field="rain_48h_mm">${formatNumber(station.rain_48h_mm, "mm")}</dd>
            <dt>Observed</dt><dd data-field="observed_at">${formatTime(station.observed_at)}</dd>
          </dl>
          <p class="note">Air and rain at the station, not soil water at the tree. <button class="button" type="button" id="refresh-station" data-station="${escapeHtml(station.id)}">Refresh live</button></p>

    function openDrawer(html) {
      $("#drawer").innerHTML = html;

      $("#refresh-station")?.addEventListener("click", event => refreshStation(event.currentTarget.dataset.station));
      $("#inspect-place")?.addEventListener("click", event => openLens(Number(event.currentTarget.dataset.lon), Number(event.currentTarget.dataset.lat)));
    }
    function closeDrawer() {
      $("#drawer").classList.remove("open");
      setSelectedTree(null);
      setLensMarker(null);
      syncUrl();
    }

    function showTree(tree) {
      setSelectedTree(tree);
      setLensMarker(null);
      syncUrl();
      openDrawer(`
        <div class="drawer-head">
          <button class="close" type="button" aria-label="Close">×</button>
          <div class="kicker">${escapeHtml(tree.group)}</div>
          <h2>${escapeHtml(tree.german || tree.latin || "Unknown species")}</h2>
          <div class="latin">${escapeHtml(tree.latin)}</div>
          <div class="id">${escapeHtml(tree.id)} · ${escapeHtml(tree.street)}, ${escapeHtml(tree.municipality)}</div>
        </div>
        <div class="block">
          <h3 data-group="possibility">Tree register <span class="kind observed">observed</span></h3>
          <dl class="facts">
            <dt>Age</dt><dd>${formatYears(tree.age)}${tree.age > 400 ? " (check source)" : ""}</dd>
            <dt>At this site</dt><dd>${formatYears(tree.yearsAtSite)}</dd>
            <dt>Setting</dt><dd>${escapeHtml(tree.group)}</dd>
            <dt>Protection</dt><dd>${escapeHtml(tree.protection)}</dd>
          </dl>

    function showStation(station) {
      openDrawer(`
        <div class="drawer-head">
          <button class="close" type="button" aria-label="Close">×</button>
          <div class="kicker">meteoblue Smart Climate station</div>
          <h2>${escapeHtml(station.name)}</h2>
          <div class="id">${escapeHtml(station.id)}</div>
        </div>
        ${stationBlock({ station, distance: null }, "Latest reading")}

    function showStories() {
      openDrawer(`
        <div class="drawer-head">
          <button class="close" type="button" aria-label="Close">×</button>
          <div class="kicker">From the evidence atlas</div>
          <h2>What the map can and cannot say</h2>
        </div>
        ${STORIES.map(story => `
          <div class="block story">
            <h3>${escapeHtml(story.title)}</h3>
            ${story.record_ids.map(recordById).filter(Boolean).map(record => `
              <div class="story-item"><b><span>${escapeHtml(record.title)}</span>${kindBadge(record.status)}</b><p>${escapeHtml(record.answer)}</p></div>`).join("")}
          </div>`).join("")}
        <div class="block sources">Full records, sources and open questions: <a href="evidence-atlas.html">Evidence atlas</a>.</div>`);

    // ---------- Place lens: every layer, read at one point
    async function queryHeatFocus(lon, lat) {
      const bbox = mercatorBox(lon, lat, 1).join(",");
      const url = `${BS_WMS}&REQUEST=GetFeatureInfo&LAYERS=ch.bs.fokusgebiet_hitzeentwicklung_fgsk&QUERY_LAYERS=ch.bs.fokusgebiet_hitzeentwicklung_fgsk&STYLES=&CRS=EPSG:3857&BBOX=${bbox}&WIDTH=101&HEIGHT=101&I=50&J=50&INFO_FORMAT=application/json&FEATURE_COUNT=1`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const feature = (await response.json()).features?.[0];
      if (!feature) return { label: "Outside the classified area", raw: null };
      const art = feature.properties?.Art;
      const labels = { "Fokus": "High need for action (focus area)", "Verbessern": "Improve the situation", "Erhalten": "Maintain the situation", "übriges Gebiet": "Other area (mostly green and open space)" };
      return { label: labels[art] || art || "Classified (no label)", raw: art };
    }
    async function queryRunoff(lon, lat) {
      const t = tilePixel(lon, lat, 14);
      const response = await fetch(`https://wmts.geo.admin.ch/1.0.0/${RUNOFF_ID}/default/current/3857/${t.z}/${t.x}/${t.y}.png`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const bitmap = await createImageBitmap(await response.blob());
      const canvas = document.createElement("canvas");
      canvas.width = 256; canvas.height = 256;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(bitmap, 0, 0);
      return matchRunoffColour([...context.getImageData(t.px, t.py, 1, 1).data]);
    }

    function reading(label, value, kind, why) {
      return `<div class="reading"><span>${escapeHtml(label)}</span><span class="value">${escapeHtml(value)} ${kindBadge(kind)}</span>${why ? `<span class="why">${escapeHtml(why)}</span>` : ""}</div>`;
    }

    async function openLens(lon, lat) {
      setSelectedTree(null);
      setLensMarker([lon, lat]);
      syncUrl();
      const radius = 25;
      const near = treesNear(lon, lat, TREES, radius);
      const station = SNAPSHOT.stations.length ? nearestStation(lon, lat, SNAPSHOT.stations) : null;
      const perimeters = perimetersAt(lon, lat, SNAPSHOT.perimeters);
      const street = near[0]?.street || (treesNear(lon, lat, TREES, 120)[0]?.street) || "";
      const header = `
        <div class="drawer-head">
          <button class="close" type="button" aria-label="Close">×</button>
          <div class="kicker">Place lens · ${radius} m radius</div>
          <h2>${street ? `Near ${escapeHtml(street)}` : "This place"}</h2>
          <div class="id">${lat.toFixed(5)} N, ${lon.toFixed(5)} E</div>
        </div>`;
      openDrawer(header + `<div class="block"><p class="note" style="margin:0">Reading layers…</p></div>`);

      const [focus, runoff] = await Promise.allSettled([queryHeatFocus(lon, lat), queryRunoff(lon, lat)]);
      if (!state.lens || state.lens[0] !== lon || state.lens[1] !== lat) return;
      const profile = buildPlaceProfile({
        lon, lat, radius, generatedAt: new Date().toISOString(), treesNearby: near, station, perimeters,
        heatFocus: focus.status === "fulfilled" ? focus.value : null, heatFocusError: focus.status === "rejected" ? `Query failed: ${focus.reason.message}` : null,
        runoff: runoff.status === "fulfilled" ? runoff.value : null, runoffError: runoff.status === "rejected" ? `Tile read failed: ${runoff.reason.message}` : null
      });
      const p = profile;
      const species = Object.entries(near.reduce((acc, tree) => ({ ...acc, [tree.genus || "unknown"]: (acc[tree.genus || "unknown"] || 0) + 1 }), {})).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([g, n]) => `${g} ${n}`).join(", ");

      openDrawer(header + `
        <div class="block">
          <h3 data-group="need">Need</h3>
          ${reading("Heat focus area", p.need.heat_focus_area.value ?? "unknown", p.need.heat_focus_area.status, p.need.heat_focus_area.note)}
          ${reading("Surface runoff, rare events", p.need.surface_runoff.value ?? "unknown", p.need.surface_runoff.status, p.need.surface_runoff.note)}
          ${reading("Night heat · day heat stress", "see map layer", "modelled", "Klimaanalyse rasters are visual only; no values are exposed")}
        </div>
        <div class="block">
          <h3 data-group="possibility">Possibility</h3>
          ${reading(`Register trees within ${radius} m`, String(p.possibility.existing_tree_count.value), "observed", species ? `Most common: ${species}` : "")}
          ${reading("Street trees", String(p.possibility.street_tree_count.value), "observed")}
          ${reading("Canopy · sealed surface", "unknown", "unknown", "Datasets exist on data.bs.ch but are not loaded yet")}
        </div>
        <div class="block">
          <h3 data-group="observations">Observations</h3>
          ${station ? reading(`Nearest station: ${station.station.name}`, `${formatNumber(station.station.air_temp_c, "°C")} · ${formatNumber(station.station.rain_48h_mm, "mm")}/48 h`, "observed", `${Math.round(station.distance)} m away · ${formatTime(station.station.observed_at)}`) : reading("Climate station", "none active", "unknown")}
        </div>
        <div class="block">
          <h3 data-group="planning">Planning</h3>
          ${reading("VoltaNord development plan", perimeters.length ? [...new Set(perimeters.map(item => item.plan))].join(", ") : "outside", "planning", perimeters.length ? "Planning perimeter, not the ZHAW monitoring sites" : "")}
        </div>
        <div class="block">
          <h3 data-group="unknown">Unknown</h3>
          ${reading("Soil water · infiltration", "unknown", "unknown", "No public measurement in Basel")}
          ${reading("Utilities · ownership", "unknown", "unknown", "Not public or not loaded")}
        </div>
        <div class="block">
          <h3>Place Profile</h3>
          <div class="actions"><button class="button" type="button" id="copy-profile">Copy JSON</button><button class="button" type="button" id="download-profile">Download</button><a class="button" href="../adaptive-interface/demo/index.html?${new URLSearchParams({ lat: lat.toFixed(5), lon: lon.toFixed(5), radius: String(radius), from: "situation-map", place_id: profile.place_id })}" title="Adaptive Interface handoff (adaptive-interface/contracts/handoff.md)">Open in Sponge View →</a></div>
          <details class="reference"><summary>Show JSON</summary><pre class="json">${escapeHtml(JSON.stringify(profile, null, 2))}</pre></details>
          <p class="note">Unknowns stay unknown. Nothing here is a suitability score.</p>
        </div>
        <div class="block sources">${BS_CREDIT}; © BAFU via geo.admin.ch; ${sourceLinks(["100052", "100009", "100234"])}.</div>`);
      const json = JSON.stringify(profile, null, 2);
      $("#copy-profile").addEventListener("click", async event => {
        try { await navigator.clipboard.writeText(json); event.target.textContent = "Copied ✓"; } catch { event.target.textContent = "Copy failed"; }
      });
      $("#download-profile").addEventListener("click", () => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
        link.download = `${profile.place_id}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
      });
    }

    async function refreshStation(id) {
      const button = $("#refresh-station");
      button.disabled = true;
      button.textContent = "Loading…";
      try {
        const params = new URLSearchParams({ where: `name_original="${id}"`, order_by: "dates_max_date desc", limit: "1", select: "dates_max_date,meta_airtemp,meta_rain24h_sum,meta_rain48h_sum" });
        const response = await fetch(`https://data.bs.ch/api/explore/v2.1/catalog/datasets/100009/records?${params}`);
        if (!response.ok) throw new Error(response.status);
        const row = (await response.json()).results[0];
        if (!row) throw new Error("no reading");
        const values = { air_temp_c: formatNumber(row.meta_airtemp, "°C"), rain_24h_mm: formatNumber(row.meta_rain24h_sum, "mm"), rain_48h_mm: formatNumber(row.meta_rain48h_sum, "mm"), observed_at: formatTime(row.dates_max_date) };
        for (const [field, text] of Object.entries(values)) document.querySelector(`#station-block [data-field="${field}"]`).textContent = text;
        button.textContent = "Live ✓";
      } catch {
        button.textContent = "Live data unavailable";
      }
    }

    function renderSearch() {
      const results = search(TREES, $("#search").value);
      $("#search-results").innerHTML = results.map((result, i) => `<li><button type="button" data-i="${i}"><span>${escapeHtml(result.label)}</span><small>${escapeHtml(result.detail)}</small></button></li>`).join("");
      document.querySelectorAll("#search-results button").forEach(button => button.addEventListener("click", () => {
        const result = results[Number(button.dataset.i)];
        if (result.type === "tree") { map.flyTo({ center: [result.trees[0].lon, result.trees[0].lat], zoom: 18 }); showTree(result.trees[0]); }
        else map.fitBounds(bounds(result.trees), { padding: 80, maxZoom: 18, pitch: map.getPitch() });
        $("#search-results").innerHTML = "";
      }));
    }

    // ---------- Modes
    async function reloadBasemap() {
      try {
        map.setStyle(await basemapStyle(), { diff: false });
      } catch {
        $("#map-error").style.display = "block";
        $("#map-error").textContent = "The swisstopo basemap could not load. Try another basemap.";
      }
    }
    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.dataset.theme = theme;
      $("#toggle-theme").setAttribute("aria-pressed", String(theme === "dark"));
      renderLayerPanel();
      if (window.map) reloadBasemap();
      syncUrl();
    }
    function setThreeD(on) {
      state.threeD = on;
      $("#toggle-3d").setAttribute("aria-pressed", String(on));
      if (on) state.on.add("buildings");
      if (window.map) {
        map.easeTo({ pitch: on ? 58 : 0, bearing: on ? (map.getBearing() || -20) : 0, zoom: on ? Math.max(map.getZoom(), 15.2) : map.getZoom(), duration: 900 });
        applyLayers();
      }
      renderLayerPanel();
      syncUrl();
    }

    // ---------- Boot
    renderLayerPanel();
    document.documentElement.dataset.theme = state.theme;
    $("#toggle-theme").setAttribute("aria-pressed", String(state.theme === "dark"));
    $("#toggle-3d").setAttribute("aria-pressed", String(state.threeD));
    $("#basemap").value = state.basemap;

    let map;
    if (typeof maplibregl === "undefined") {
      $("#map-error").style.display = "block";
      $("#map-error").textContent = "The map library could not load (offline?). Search, legend and tree cards still work from the embedded snapshot.";
    } else {
      (async () => {
        map = window.map = new maplibregl.Map({
          container: "map",
          style: await basemapStyle().catch(() => SWISSTOPO_STYLE),
          center: [initial.lon ?? 7.598, initial.lat ?? 47.565],
          zoom: initial.zoom ?? 12.4,
          pitch: initial.pitch ?? 0,
          bearing: initial.bearing ?? 0,
          minZoom: 10,
          maxZoom: 19.5,
          maxPitch: 70,
          maxBounds: [[7.35, 47.45], [7.85, 47.68]],
          attributionControl: false
        });
        map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: [DATA_CREDIT] }), "bottom-right");
        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
        map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");
        map.on("style.load", addDataLayers);
        map.on("moveend", () => { renderHud(); syncUrl(); });
        map.on("mousemove", event => { state.cursor = event.lngLat; renderHud(); });

        const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
        map.on("mousemove", "trees", event => {
          map.getCanvas().style.cursor = "pointer";
          const tree = TREES[event.features[0].properties.i];
          popup.setLngLat([tree.lon, tree.lat]).setHTML(`<b>${escapeHtml(tree.german || tree.latin)}</b><br>${formatYears(tree.age)} · ${escapeHtml(tree.street)}`).addTo(map);
        });
        map.on("mouseleave", "trees", () => { map.getCanvas().style.cursor = ""; popup.remove(); });
        map.on("mousemove", "stations", event => {
          map.getCanvas().style.cursor = "pointer";
          const station = SNAPSHOT.stations[event.features[0].properties.i];
          popup.setLngLat([station.lon, station.lat]).setHTML(`<b>${escapeHtml(station.name)}</b><br>${formatNumber(station.air_temp_c, "°C")} · ${formatNumber(station.rain_48h_mm, "mm")} in 48 h`).addTo(map);
        });
        map.on("mouseleave", "stations", () => { map.getCanvas().style.cursor = ""; popup.remove(); });
        map.on("click", event => {
          const layers = ["stations", "trees"].filter(id => map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none");
          const hit = map.queryRenderedFeatures(event.point, { layers })[0];
          if (hit?.layer.id === "stations") showStation(SNAPSHOT.stations[hit.properties.i]);
          else if (hit?.layer.id === "trees") showTree(TREES[hit.properties.i]);
          else openLens(event.lngLat.lng, event.lngLat.lat);
        });
        map.on("load", () => {
          renderHud();
          const tree = initial.tree && TREES.find(item => item.id === initial.tree);
          if (tree) showTree(tree);
          else if (initial.lens) openLens(initial.lens[0], initial.lens[1]);
        });
      })();
    }

    $("#search").addEventListener("input", renderSearch);
    $("#basemap").addEventListener("change", event => { state.basemap = event.target.value; $("#map-error").style.display = "none"; if (map) reloadBasemap(); syncUrl(); });
    $("#open-story").addEventListener("click", showStories);
    $("#toggle-theme").addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark"));
    $("#toggle-3d").addEventListener("click", () => setThreeD(!state.threeD));
    $("#lens-center").addEventListener("click", () => { if (map) { const c = map.getCenter(); openLens(c.lng, c.lat); } });
    $("#panel-toggle").addEventListener("click", event => {
      const expanded = $("#panel").classList.toggle("expanded");
      event.currentTarget.setAttribute("aria-expanded", String(expanded));
    });
    document.addEventListener("keydown", event => {
      if (event.target.matches("input, select, textarea")) { if (event.key === "Escape") event.target.blur(); return; }
      if (event.key === "Escape" && $("#drawer").classList.contains("open")) closeDrawer();
      else if (event.key === "/") { event.preventDefault(); $("#search").focus(); }
      else if (event.key === "3") setThreeD(!state.threeD);
      else if (event.key.toLowerCase() === "t") setTheme(state.theme === "dark" ? "light" : "dark");
      else if (event.key.toLowerCase() === "l" && map) { const c = map.getCenter(); openLens(c.lng, c.lat); }
    });
  </script>
</body>
</html>
