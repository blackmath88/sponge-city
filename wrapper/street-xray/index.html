<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="" />
  <title>Street X-Ray · SpongeSquad</title>
  <style>
    :root {
      color-scheme: light;
      --ink:#202a25; --muted:#6f7a73; --soft:#919b94; --line:#dfe5df;
      --paper:#fff; --ground:#f3f5f1; --green:#246b4e; --green-2:#dceade;
      --blue:#39747c; --blue-2:#e0edef; --amber:#9a6a35; --amber-2:#f4e9d8;
      --red:#a95442; --dark:#16241d; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
      --sans:Inter,"Helvetica Neue",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px}
    button,a,input{font:inherit}
    button,a{touch-action:manipulation}
    a{color:inherit}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid rgba(36,107,78,.28);outline-offset:2px}
    .top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:12px;font-weight:700}
    .brand-mark{width:33px;height:33px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font:700 11px var(--mono)}
    .crumb{font:10px var(--mono);color:var(--muted)}
    .crumb span{color:#bdc5bf;padding:0 7px}
    .stage{font:10px var(--mono);color:var(--green);border:1px solid #cfe0d2;background:#edf5ef;border-radius:20px;padding:7px 10px}
    main{max-width:1580px;margin:0 auto;padding:0 28px 70px}
    .intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(340px,.9fr);gap:70px;align-items:end;padding:64px 0 38px}
    .eyebrow{font:600 10px var(--mono);letter-spacing:1.25px;color:var(--green);text-transform:uppercase}
    h1{font-size:clamp(44px,6.2vw,86px);line-height:.96;letter-spacing:-.065em;margin:15px 0 22px;max-width:920px}
    h1 em{font-style:normal;font-weight:400;color:#6c8475}
    .lede{font-size:16px;line-height:1.65;color:var(--muted);max-width:720px;margin:0}
    .premise{background:var(--dark);color:#eef3ef;border-radius:10px;padding:25px;min-height:180px;position:relative;overflow:hidden}
    .premise:after{content:"?";position:absolute;right:16px;bottom:-31px;color:rgba(255,255,255,.06);font:700 160px/1 var(--mono)}
    .premise small{font:10px var(--mono);color:#8fb09c;letter-spacing:.7px}
    .premise blockquote{font-size:20px;line-height:1.35;letter-spacing:-.02em;margin:20px 0 12px;max-width:420px}
    .premise p{font-size:11px;line-height:1.55;color:#9dafaa;margin:0;max-width:430px}
    .workspace{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.55fr);border:1px solid var(--line);background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 20px 60px rgba(35,57,44,.08)}
    .map-column{min-width:0;border-right:1px solid var(--line)}
    .map-head{min-height:80px;padding:17px 20px;display:flex;gap:20px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .location small{display:block;font:9px var(--mono);color:var(--soft);text-transform:uppercase;letter-spacing:.9px;margin-bottom:6px}
    .location b{font-size:15px}
    .location span{color:var(--muted);font-size:11px;margin-left:8px}
    .layer-tabs{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    .layer-tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 11px;font:600 10px var(--mono);color:var(--muted);cursor:pointer}
    .layer-tab:hover{background:#f6f8f5}
    .layer-tab[aria-selected="true"]{color:#fff;border-color:var(--green);background:var(--green)}
    .layer-tab[data-layer="derived"][aria-selected="true"]{background:var(--blue);border-color:var(--blue)}
    .layer-tab[data-layer="ask"][aria-selected="true"]{background:var(--amber);border-color:var(--amber)}
    .map-stage{position:relative;background:#e9ede7;min-height:590px;overflow:hidden}
    .map-stage svg{display:block;width:100%;height:auto;min-height:590px}
    .map-caption{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid rgba(210,220,212,.9);padding:9px 11px;border-radius:7px;font:9px/1.45 var(--mono);color:var(--muted);max-width:430px}
    .map-caption:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
    .map-caption.derived:before{background:var(--blue)} .map-caption.ask:before{background:var(--amber)}
    .rain-control{position:absolute;right:17px;bottom:17px;border:0;background:var(--dark);color:#fff;border-radius:7px;padding:10px 13px;font-size:11px;font-weight:700;cursor:pointer}
    .rain-control:hover{background:#284437}
    .map-layer{opacity:0;pointer-events:none;transition:opacity .25s ease}
    .map-layer.active{opacity:1;pointer-events:auto}
    .base-label{font:600 10px var(--mono);fill:#5e6c63;letter-spacing:.06em}
    .tiny-label{font:500 8px var(--mono);fill:#6e7b73}
    .object-label{font:600 9px var(--mono);fill:#fff}
    .flow-path{stroke-dasharray:7 6}
    .raining .flow-path{animation:flow .7s linear infinite}
    .raining .rain-drop{animation:fall .8s ease-in infinite}
    .rain-drop:nth-child(2){animation-delay:.2s}.rain-drop:nth-child(3){animation-delay:.4s}.rain-drop:nth-child(4){animation-delay:.6s}
    @keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes fall{0%{transform:translateY(-15px);opacity:0}30%{opacity:1}100%{transform:translateY(45px);opacity:0}}
    .evidence-panel{display:flex;flex-direction:column;min-height:670px}
    .panel-head{padding:23px;border-bottom:1px solid var(--line)}
    .panel-kicker{font:600 9px var(--mono);color:var(--green);letter-spacing:.9px;text-transform:uppercase}
    .panel-head h2{font-size:23px;line-height:1.15;letter-spacing:-.04em;margin:10px 0 9px}
    .panel-head p{font-size:11px;line-height:1.55;color:var(--muted);margin:0}
    .claim-list{display:grid;overflow:auto;max-height:430px}
    .claim{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:16px 20px;text-align:left;cursor:pointer;display:grid;grid-template-columns:9px 1fr auto;gap:11px;align-items:start}
    .claim:hover,.claim.active{background:#f6f8f5}
    .claim-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:4px}
    .claim[data-layer="derived"] .claim-dot{background:var(--blue)}
    .claim[data-layer="ask"] .claim-dot{background:var(--amber);border-radius:1px}
    .claim-title{display:block;font-size:12px;font-weight:700;line-height:1.3;margin-bottom:5px}
    .claim-meta{display:block;font:9px var(--mono);color:var(--soft);line-height:1.45;text-transform:uppercase}
    .claim-value{font:700 12px var(--mono);color:var(--green);white-space:nowrap}
    .claim[data-layer="derived"] .claim-value{color:var(--blue)}
    .claim[data-layer="ask"] .claim-value{color:var(--amber)}
    .claim-detail{padding:19px 21px;background:#f8faf7;margin-top:auto;border-top:1px solid var(--line)}
    .claim-detail .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
    .badge{font:600 8px var(--mono);text-transform:uppercase;letter-spacing:.35px;border:1px solid #cbd6cd;border-radius:3px;padding:4px 6px;background:#fff;color:#5f6f65}
    .badge.derived,.badge.modelled{border-style:dashed;color:var(--blue)}
    .badge.assumed{font-style:italic;color:#7d6849}.badge.unknown{border-style:dotted;color:var(--amber)}
    .claim-detail p{font-size:10px;line-height:1.55;color:var(--muted);margin:8px 0}
    .claim-detail strong{color:var(--ink)}
    .source-link{font:600 9px var(--mono);color:var(--green)}
    .decision{margin:30px 0 0;display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
    .decision-title{padding:28px;border-right:1px solid var(--line);background:#fafbf9}
    .decision-title h2{font-size:31px;line-height:1.05;letter-spacing:-.045em;margin:13px 0 15px}
    .decision-title p{font-size:12px;line-height:1.65;color:var(--muted)}
    .status-pill{display:inline-flex;gap:7px;align-items:center;font:600 9px var(--mono);text-transform:uppercase;color:var(--amber);border:1px solid #e5d3b9;background:#fbf5ea;border-radius:20px;padding:7px 9px}
    .status-pill:before{content:"";width:7px;height:7px;background:currentColor;border-radius:50%}
    .status-pill.candidate{color:var(--green);background:#edf5ef;border-color:#cfe0d2}
    .scenario-box{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}
    .scenario-number{display:flex;align-items:baseline;gap:6px;font:700 34px var(--mono);color:var(--blue)}
    .scenario-number small{font:600 10px var(--mono);color:var(--muted)}
    .range{width:100%;accent-color:var(--blue);margin-top:12px}
    .scenario-box p{font-size:9px;line-height:1.5;margin:7px 0 0}
    .checks{padding:28px}
    .checks-head{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:20px}
    .checks-head h3{font-size:18px;margin:0 0 6px}.checks-head p{font-size:10px;color:var(--muted);line-height:1.5;margin:0;max-width:520px}
    .check-list{display:grid;gap:8px}
    .unlock{border:1px solid var(--line);border-radius:7px;padding:14px 15px;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;background:#fff;cursor:pointer;text-align:left}
    .unlock:hover{border-color:#b4c4b8}.unlock.on{background:#f0f6f1;border-color:#b9d1bf}
    .unlock-icon{width:33px;height:33px;display:grid;place-items:center;border-radius:50%;background:var(--amber-2);color:var(--amber);font:700 13px var(--mono)}
    .unlock.on .unlock-icon{background:var(--green-2);color:var(--green)}
    .unlock b{display:block;font-size:12px;margin-bottom:4px}.unlock small{display:block;font-size:9px;line-height:1.4;color:var(--muted)}
    .unlock-state{font:600 8px var(--mono);text-transform:uppercase;color:var(--amber)}.unlock.on .unlock-state{color:var(--green)}
    .decision-note{margin-top:14px;padding:12px 14px;background:#f6f8f5;border-left:3px solid var(--amber);font-size:10px;line-height:1.55;color:var(--muted)}
    .decision-note.ready{border-color:var(--green)}
    .street-switch{display:flex;gap:4px;margin-top:8px}.street-switch a{font:600 8px var(--mono);text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:4px 8px;text-decoration:none}.street-switch a[aria-current="page"]{color:var(--dark);border-color:var(--dark)}
    .unlock.no{background:#fbf3ec;border-color:#e5d3b9}.unlock.no .unlock-icon{background:#f3e3d0;color:var(--amber)}.unlock.no .unlock-state{color:var(--amber)}
    .futures{margin-top:14px;display:grid;gap:4px}.futures h4{font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--soft);margin:0 0 4px}
    .future{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:10px;padding:7px 10px;border:1px solid var(--line);border-radius:6px}.future small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
    .future b{font-weight:600}.future .state{font:600 8px var(--mono);text-transform:uppercase;align-self:center;color:var(--amber)}.future.candidate .state{color:var(--green)}.future.excluded{opacity:.6}.future.excluded .state{color:var(--muted)}
    .passport{margin:30px 0 0;background:var(--dark);color:#edf2ee;border-radius:10px;padding:30px}
    .passport-head{display:flex;justify-content:space-between;gap:24px;align-items:start;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:24px}
    .passport h2{font-size:31px;letter-spacing:-.04em;margin:10px 0 7px}.passport-head p{color:#9bada2;margin:0;font-size:11px}
    .passport-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .action{border:1px solid rgba(255,255,255,.2);color:#fff;background:transparent;border-radius:6px;padding:9px 11px;font-size:10px;font-weight:700;text-decoration:none;cursor:pointer}
    .action.primary{background:#e8f0e9;color:var(--dark);border-color:#e8f0e9}
    .passport-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:22px}
    .passport-cell{padding:8px 21px 8px 0;border-right:1px solid rgba(255,255,255,.11);margin-right:21px;min-height:120px}
    .passport-cell:last-child{border:0;margin:0}
    .passport-cell small{font:8px var(--mono);color:#8fa497;text-transform:uppercase;letter-spacing:.7px}
    .passport-cell b{display:block;font-size:13px;margin:10px 0 8px}.passport-cell p,.passport-cell li{font-size:10px;line-height:1.55;color:#aab9b0}
    .passport-cell ul{padding-left:15px;margin:0}
    .integrity{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:20px;color:#8fa497;font:9px/1.5 var(--mono)}
    .integrity strong{color:#dce8df}
    .loading{min-height:700px;display:grid;place-items:center;font:11px var(--mono);color:var(--muted)}
    footer{display:flex;justify-content:space-between;gap:20px;padding:24px 0;color:var(--soft);font:9px var(--mono)}
    @media(max-width:1050px){.intro{grid-template-columns:1fr;gap:25px}.workspace{grid-template-columns:1fr}.map-column{border:0;border-bottom:1px solid var(--line)}.evidence-panel{min-height:0}.claim-list{max-height:none}.decision{grid-template-columns:1fr}.decision-title{border:0;border-bottom:1px solid var(--line)}.passport-grid{grid-template-columns:repeat(2,1fr);row-gap:25px}.passport-cell:nth-child(2){border:0}.passport-cell:nth-child(3){padding-top:10px}}
    @media(max-width:680px){.top{padding:0 14px}.crumb{display:none}main{padding:0 15px 45px}.intro{padding:40px 0 28px}h1{font-size:48px}.premise{min-height:0}.map-head{align-items:flex-start;flex-direction:column}.layer-tabs{justify-content:flex-start}.map-stage,.map-stage svg{min-height:460px}.map-stage svg{width:145%;transform:translateX(-20%)}.rain-control{right:10px;bottom:10px}.map-caption{left:10px;bottom:57px;right:10px}.checks,.decision-title,.passport{padding:21px}.unlock{grid-template-columns:34px 1fr}.unlock-state{grid-column:2}.passport-head{display:block}.passport-actions{justify-content:flex-start;margin-top:18px}.passport-grid{grid-template-columns:1fr}.passport-cell,.passport-cell:nth-child(2){border:0;border-bottom:1px solid rgba(255,255,255,.11);margin:0;padding:18px 0}.integrity{display:block}.integrity span{display:block;margin-top:7px}footer{display:block}footer span{display:block;margin-top:7px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}
    @media print{body{background:#fff}.top,.intro,.rain-control,.layer-tabs,.checks,.passport-actions,footer{display:none!important}main{max-width:none;padding:0}.workspace,.decision,.passport{box-shadow:none;border-radius:0;break-inside:avoid;margin:0 0 18px}.workspace{grid-template-columns:1.2fr .8fr}.map-stage,.map-stage svg{min-height:430px}.evidence-panel{min-height:0}.claim-list{max-height:none}.claim{padding:8px 12px}.claim-detail{display:none}.passport{background:#fff;color:#111;border:2px solid #222}.passport h2,.passport-cell b{color:#111}.passport-head p,.passport-cell p,.passport-cell li,.integrity{color:#444}.passport-cell small{color:#555}.passport-cell{border-color:#ccc}.integrity{border-color:#ccc}}
  </style>
<script>if(new URLSearchParams(location.search).get("embedded")==="1")document.documentElement.dataset.embedded="true";</script>
<style>.lang-switch{display:flex;gap:4px}.lang-switch button{font:600 10px var(--mono);border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:14px;padding:6px 9px;cursor:pointer}.lang-switch button[aria-pressed="true"]{color:#fff;background:var(--green);border-color:var(--green)}.top-right{display:flex;align-items:center;gap:12px}html[data-embedded=true] .lang-switch,html[data-embedded=true] .top,html[data-embedded=true] main>.intro,html[data-embedded=true] .street-switch,html[data-embedded=true] main>footer{display:none}html[data-embedded=true] main{max-width:none;padding:0}html[data-embedded=true] .workspace{border:0;border-radius:0}</style>

      if (next !== 'de' && next !== 'en') next = 'de';
      lang = next;
      if (persist) persistLang(lang, store);
      const url = new URL(location.href); url.searchParams.set('lang', lang);
      history.replaceState(null, '', url);
      await render();
    }

    window.addEventListener('message', event => {
      if (event.origin === location.origin && event.data?.type === 'sponge-lang') setLang(event.data.lang, true);
    });

    async function render(){
      document.documentElement.lang = lang;
      document.title = t('title');
      document.querySelector('meta[name="description"]').setAttribute('content', t('meta_desc'));
      applyI18n(document);
      buildSwitcher();
      if (!profile) return;
      if (lang === 'de') await loadOverlay();
      view = localize(profile, lang === 'de' && overlay ? overlay.places?.[streetKey] : null);
      app.className = '';
      app.removeAttribute('data-i18n');
      app.replaceChildren(template.content.cloneNode(true));
      applyI18n(app);
      boot();
    }

    applyI18n(document);
    try {
      profile = await fetch(STREETS[streetKey].url).then(response => {
        if (!response.ok) throw new Error(`Profile request failed: ${response.status}`);
        return response.json();
      });
      await render();
    } catch (error) {
      app.removeAttribute('data-i18n');
      app.textContent = t('load_error');
      console.error(error);
    }

    function boot(){
      const computed = profile.site.identity_status.startsWith('computed');
      document.querySelectorAll('[data-site-name]').forEach(node => node.textContent = view.site.name);
      document.querySelector('[data-site-status]').textContent = computed ? t('site_computed') : t('site_demo');
      document.querySelector('[data-site-length]').textContent = `· ${view.site.length_m} m ${computed ? t('len_street') : t('len_demo')}`;
      const linkParams = new URLSearchParams(location.search); linkParams.delete('street');
      document.querySelector('.street-switch').append(...Object.keys(STREETS).map(key => {
        const link = document.createElement('a'); const q = new URLSearchParams(linkParams); q.set('street', key);
        link.href = `?${q}`; link.textContent = t(`street_${key}`);
        if (key === streetKey) link.setAttribute('aria-current', 'page');
        return link;
      }));
      fillSchematic(computed);
      fillPassport();
      document.querySelector('[data-boundary]').textContent = view.site.boundary;
      document.querySelector('[data-intervention-name]').textContent = view.intervention.name;
      document.querySelector('[data-intervention-why]').textContent = view.intervention.why;
      buildTabs();
      buildChecks();
      buildStreetLabLink();
      setLayer(view.layers.some(layer => layer.id === activeLayer) ? activeLayer : 'known');
      const stage = document.querySelector('#map-stage'), rainButton = document.querySelector('#rain-control');
      stage.classList.toggle('raining', raining); rainButton.setAttribute('aria-pressed', String(raining)); rainButton.textContent = raining ? t('rain_stop') : t('rain_start');
      rainButton.addEventListener('click', toggleRain);
      document.querySelector('#rainfall').addEventListener('input', updateRainfall);
      document.querySelector('#print').addEventListener('click', () => window.print());
    }

    function buildTabs(){
      const tabs = document.querySelector('.layer-tabs');
      for(const layer of view.layers){
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'layer-tab'; button.dataset.layer = layer.id;
        button.setAttribute('role','tab'); button.textContent = layer.short_label;
        button.addEventListener('click',()=>setLayer(layer.id));
        tabs.append(button);
      }
    }

    function setLayer(id){
      activeLayer = id;
      const layer = view.layers.find(item => item.id === id);
      history.replaceState(null,'',`${location.search}#${id}`);
      document.querySelectorAll('.layer-tab').forEach(tab => tab.setAttribute('aria-selected',String(tab.dataset.layer === id)));
      document.querySelectorAll('[data-map-layer]').forEach(group => group.classList.toggle('active',group.dataset.mapLayer === id));
      document.querySelector('#layer-kicker').textContent = layer.label;
      document.querySelector('#layer-question').textContent = layer.question;
      document.querySelector('#layer-summary').textContent = layer.summary;
      const caption = document.querySelector('#map-caption');
      caption.className = `map-caption ${id}`; caption.textContent = layer.summary;
      const claims = view.claims.filter(claim => claim.layer === id);
      const list = document.querySelector('#claim-list'); list.replaceChildren();
      claims.forEach((claim,index) => {
        const button = document.createElement('button');
        button.type='button'; button.className='claim'; button.dataset.layer=id;
        button.innerHTML = `<span class="claim-dot"></span><span><span class="claim-title">${escapeHtml(claim.title)}</span><span class="claim-meta">${escapeHtml(tm('evidence', claim.evidence_class))} · ${escapeHtml(tm('origin', claim.origin))} · ${escapeHtml(tm('validation', claim.validation))}</span></span><span class="claim-value">${escapeHtml(claim.value)}</span>`;
        button.addEventListener('click',()=>showClaim(claim,button)); list.append(button);
        if(index===0) showClaim(claim,button);
      });
    }

    function showClaim(claim,button){
      document.querySelectorAll('.claim').forEach(item=>item.classList.toggle('active',item===button));
      const detail = document.querySelector('#claim-detail');
      const source = claim.source_url ? `<a class="source-link" href="${escapeHtml(claim.source_url)}" target="_blank" rel="noreferrer">${escapeHtml(claim.source)} ↗</a>` : `<span class="source-link">${escapeHtml(claim.source)}</span>`;
      const action = claim.unlock_action ? `<p><strong>${escapeHtml(t('unlock'))}:</strong> ${escapeHtml(claim.unlock_action)}</p>` : '';
      const gatekeeper = claim.gatekeeper ? `<p><strong>${escapeHtml(t('gatekeeper'))}:</strong> ${escapeHtml(claim.gatekeeper)}</p>` : '';
      const uses = claim.permitted_use.map(use => tm('use_map', use)).join(' + ') || t('none');
      detail.innerHTML = `<div class="badges"><span class="badge ${claim.evidence_class}">${escapeHtml(tm('evidence', claim.evidence_class))}</span><span class="badge">${escapeHtml(tm('access', claim.access_state))}</span><span class="badge">${escapeHtml(t('use'))} · ${escapeHtml(uses)}</span></div><p><strong>${escapeHtml(t('method'))}:</strong> ${escapeHtml(claim.method || t('no_method'))}</p><p><strong>${escapeHtml(t('limit'))}:</strong> ${escapeHtml(claim.limitation)}</p>${gatekeeper}${action}${source}`;
    }

    function treeScope(snap){
      if (!snap.tree_scope) return t('scope_within')(snap.tree_radius_m);
      const match = /^in the (\d+) m corridor$/.exec(snap.tree_scope);
      return match ? t('scope_corridor')(match[1]) : snap.tree_scope;
    }

    function fillSchematic(computed){
      const snap=view.snapshot, gw=snap.nearest_groundwater_station, area=view.intervention.scenario.footprint_m2;
      document.querySelector('#map-title').textContent=t('map_title')(view.site.name);
      document.querySelector('#seg-label').textContent=computed?t('seg_generic')(view.site.length_m):t('seg_demo')(view.site.length_m);
      document.querySelector('#tree-label').textContent=snap.tree_count===1?t('trees_one')(snap.tree_count):t('trees_many')(snap.tree_count);
      document.querySelector('#tree-sub').textContent=t('trees_sub')(treeScope(snap));
      document.querySelector('#gw-label').textContent=gw.id?`GW ${gw.id.padStart(4,'0')}`:t('gw_station');
      document.querySelector('#gw-sub').textContent=t('gw_away')(gw.distance_m);
      document.querySelector('#strip-label').textContent=computed?t('strip_computed')(area):t('strip_demo')(area);
      document.querySelector('#footprint-label').textContent=area;
      const rain=document.querySelector('#rainfall'); rain.value=rainMm ?? view.intervention.scenario.rainfall_mm; updateRainfall({target:rain});
    }

    function fillPassport(){
      const item=text=>{const li=document.createElement('li'); li.textContent=text; return li;};
      const byLayer=layer=>view.claims.filter(claim=>claim.layer===layer);
      document.querySelector('#passport-known').replaceChildren(...byLayer('known').slice(0,4).map(claim=>item(`${claim.title} ${claim.value}`)));
      document.querySelector('#passport-derived').replaceChildren(...byLayer('derived').slice(0,3).map(claim=>item(`${claim.title}: ${claim.value} ${claim.unit}`)), item(t('explain_only')));
      const blocked=view.intervention.blocking_claims.map(id=>view.claims.find(claim=>claim.id===id));
      document.querySelector('#passport-blocked-title').textContent=t('c3_b')(blocked.length);
      document.querySelector('#passport-blocked').replaceChildren(...blocked.map(claim=>item(claim.title)));
    }

    function buildChecks(){
      const list=document.querySelector('#check-list');
      for(const id of view.intervention.blocking_claims){
        const claim=view.claims.find(item=>item.id===id);
        const button=document.createElement('button'); button.type='button'; button.className='unlock'; button.dataset.id=id;
        button.innerHTML=`<span class="unlock-icon">?</span><span><b>${escapeHtml(claim.title)}</b><small>${escapeHtml(claim.unlock_action)}</small></span><span class="unlock-state"></span>`;
        paintCheck(button,id);
        button.addEventListener('click',()=>cycleCheck(button,id)); list.append(button);
      }
      updateDecision();
    }

    function paintCheck(button,id){
      const options=profile.engine.checks[id].options;
      const answer=answers.get(id), positive=answer===options[0];
      button.classList.toggle('on',positive); button.classList.toggle('no',Boolean(answer)&&!positive);
      button.setAttribute('aria-pressed',String(Boolean(answer)));
      button.querySelector('.unlock-icon').textContent=answer?(positive?'✓':'✕'):'?';
      button.querySelector('.unlock-state').textContent=answer?t('rehearsed')(tm('answer',answer)):t('not_answered');
    }

    // Each click moves to the next declared answer, then back to "not answered".
    function cycleCheck(button,id){
      const options=profile.engine.checks[id].options;
      const next=answers.has(id)?options.indexOf(answers.get(id))+1:0;
      if(next>=options.length) answers.delete(id); else answers.set(id,options[next]);
      paintCheck(button,id);
      updateDecision();
    }

    function updateDecision(){
      const lower=text=>DICT[lang].lowercase?text.toLowerCase():text;
      const total=profile.intervention.blocking_claims.length;
      document.querySelector('#check-count').textContent=t('check_count')(answers.size,total);
      const facts=Object.fromEntries([...answers].map(([id,answer])=>[profile.engine.checks[id].fact,answer]));
      const results=assessFacts(profile.engine.facts,facts);
      const tracked=results.filter(result=>profile.engine.interventions.includes(result.id));
      const candidates=tracked.filter(result=>result.state==='candidate');
      const state=candidates.length?'candidate':tracked.every(result=>result.state==='excluded')?'excluded':'requires-investigation';
      const factLabel=fact=>tm('fact',fact);
      const pill=document.querySelector('#status-pill'), note=document.querySelector('#decision-note'), next=document.querySelector('#next-action');
      pill.textContent=t(`st_${state}`);
      pill.classList.toggle('candidate',state==='candidate');
      note.classList.toggle('ready',state==='candidate');
      const open=profile.intervention.blocking_claims.filter(id=>!answers.has(id)).map(id=>lower(view.claims.find(item=>item.id===id).title));
      if(state==='candidate'){
        note.textContent=t('note_candidate')(candidates.map(result=>lower(tm('future',result.id))).join(t('and')));
        next.textContent=t('next_candidate');
      }else if(state==='excluded'){
        note.textContent=t('note_excluded')(tracked.flatMap(result=>result.blocking).map(factLabel).join(', '));
        next.textContent=t('next_excluded');
      }else{
        note.textContent=t('note_open')(open.join('; ') || tracked.flatMap(result=>result.unresolved).map(factLabel).join(', '));
        next.textContent=t('next_open');
      }
      const futures=document.querySelector('#futures'); futures.querySelectorAll('.future').forEach(node=>node.remove());
      for(const result of results){
        const row=document.createElement('div'); row.className=`future ${result.state}`;
        const why=result.blocking.length?t('blocked_by')(result.blocking.map(factLabel).join(', ')):result.unresolved.length?t('open_f')(result.unresolved.map(factLabel).join(', ')):tm('decision',result.permitted_decision);
        row.innerHTML=`<span><b>${escapeHtml(tm('future',result.id))}</b> · ${escapeHtml(tm('family',INTERVENTIONS.find(item=>item.id===result.id).family))}<small>${escapeHtml(why)}</small></span><span class="state">${escapeHtml(tm('fstate',result.state))}</span>`;
        futures.append(row);
      }
    }

    function updateRainfall(event){
      const mm=Number(event.target.value), area=view.intervention.scenario.footprint_m2;
      rainMm=mm;
      document.querySelector('#rain-volume').textContent=(mm/1000*area).toFixed(2);
      document.querySelector('#rainfall-label').textContent=t('rain_mm')(mm);
    }

    function toggleRain(){
      const stage=document.querySelector('#map-stage'), button=document.querySelector('#rain-control');
      raining=stage.classList.toggle('raining'); button.setAttribute('aria-pressed',String(raining)); button.textContent=raining?t('rain_stop'):t('rain_start');
      if(activeLayer!=='derived') setLayer('derived');
    }

    function buildStreetLabLink(){
      const payload={version:1,site:{id:view.site.id,name:view.site.name,district:view.site.district,coordinates:view.site.coordinates,indicators:{sources:[`Street X-Ray ${profile.schema_version}`,'Basel-Stadt tree cadastre 100052','Basel-Stadt groundwater statistics 100180'],missingData:view.intervention.blocking_claims.map(id=>view.claims.find(claim=>claim.id===id).title)},constraints:[t('lab_c1'),t('lab_c2')],directions:[view.intervention.name]},provenance:{classification:'illustrative',source:t('lab_src'),note:t('lab_site_note')}};
      const bytes=new TextEncoder().encode(JSON.stringify(payload)); let binary=''; bytes.forEach(byte=>binary+=String.fromCharCode(byte));
      const encoded=btoa(binary).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');
      document.querySelector('#street-lab-link').href=`../street-workspace/?site=${encoded}&lang=${lang}${embedded?'&embedded=1':''}`;
    }

    function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}
  </script>
</body>
</html>
