<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="title.main">Regenspaziergang · SpongeSquad</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="../" data-keep-lang="../" data-i18n="brand">SPONGE SQUAD / STRASSENLABOR</a><span id="lang-switch" class="lang-switch"></span><span data-i18n="tag">VERSTEHEN → ENTSCHEIDEN</span></header>
<main><section class="intro"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="h1"></h1><p data-i18n="intro"></p><div class="notice" data-i18n="notice.demo"></div></section>
<nav data-i18n-aria="nav.aria"><button data-tab="walk" aria-pressed="true" data-i18n="tab.walk"></button><button data-tab="review" data-i18n="tab.review"></button><button data-tab="passport" data-i18n="tab.passport"></button></nav>
<p id="save-status" role="status"></p>
<section id="walk"><div id="missions" class="missions"></div><div class="columns"><section><h2 data-i18n="walk.h"></h2><p id="mission-prompt"></p><ol><li data-i18n="walk.step1"></li><li data-i18n="walk.step2"></li><li data-i18n="walk.step3"></li><li data-i18n="walk.step4"></li><li data-i18n="walk.step5"></li></ol><p data-i18n="walk.safety"></p><div id="street" class="street" data-i18n-aria="street.aria"></div><p class="muted" data-i18n="street.note"></p></section>
<form id="capture"><h2 data-i18n="form.h"></h2><label><span data-i18n="f.place"></span><input id="place" maxlength="160" data-i18n-ph="place.ph"></label><label><span data-i18n="f.kind"></span><select id="kind"></select></label><label><span data-i18n="f.dist"></span> <output id="distance">60</output> m<input id="position" type="range" min="0" max="120" value="60"></label><label><span data-i18n="f.conf"></span><select id="confidence"><option value="low" data-i18n="conf.low"></option><option value="medium" data-i18n="conf.medium"></option><option value="high" data-i18n="conf.high"></option></select></label><label><span data-i18n="f.rain"></span><select id="rain"><option value="unknown" data-i18n="rain.unknown"></option><option value="Water enters" data-i18n="rain.enters"></option><option value="Water pools" data-i18n="rain.pools"></option><option value="Water crosses" data-i18n="rain.crosses"></option></select></label><label><span data-i18n="f.time"></span><input id="observed" type="datetime-local" required></label><label><span data-i18n="f.note"></span><textarea id="note" maxlength="1200" required data-i18n-ph="note.ph"></textarea></label><label><span data-i18n="f.photo"></span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="muted" data-i18n="form.local"></p><button type="submit" class="primary" data-i18n="form.submit"></button><p id="capture-status" role="status"></p></form></div></section>
<section id="review" hidden><h2 data-i18n="review.h"></h2><p data-i18n="review.intro"></p><label><span data-i18n="filter.label"></span><select id="filter"><option value="all" data-i18n="filter.all"></option><option value="pending" data-i18n="filter.pending"></option><option value="accepted" data-i18n="filter.accepted"></option><option value="uncertain" data-i18n="filter.uncertain"></option><option value="rejected" data-i18n="filter.rejected"></option><option value="clarification" data-i18n="filter.clarification"></option></select></label><div id="queue"></div></section>
<section id="passport" hidden><p class="eyebrow" data-i18n="passport.eyebrow"></p><h2 data-i18n="passport.h"></h2><div id="passport-content"></div><h3 data-i18n="poss.h"></h3><div class="missions"><article><h3 data-i18n="poss.a.h"></h3><p data-i18n="poss.a.p"></p></article><article><h3 data-i18n="poss.b.h"></h3><p data-i18n="poss.b.p"></p></article><article><h3 data-i18n="poss.c.h"></h3><p data-i18n="poss.c.p"></p></article></div><p data-i18n="poss.note"></p><div class="actions"><button id="export-json" class="primary" data-i18n="export.json"></button><button id="export-brief" data-i18n="export.brief"></button><a href="../" data-keep-lang="../" data-i18n="link.studio"></a></div></section>
<p><a href="references.html" data-keep-lang="references.html" data-i18n="link.refs"></a></p><footer><span data-i18n="footer.local"></span><button id="reset" data-i18n="reset"></button></footer></main><script type="module" src="app.mjs"></script></body></html>
